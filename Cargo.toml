[package]
name = "imgpyr"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Gaussian and Laplacian image pyramids over f32 planes, exact at odd sizes"
repository = "https://github.com/twangodev/imgpyr"
readme = "README.md"
keywords = ["image", "pyramid", "laplacian", "gaussian", "blending"]
categories = ["multimedia::images"]

[dependencies]
rayon = { version = "1.12.0", optional = true }

[features]
rayon = ["dep:rayon"]

[dev-dependencies]
image = "0.25.10"
proptest = "1.11.0"
